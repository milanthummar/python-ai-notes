[project]
name = "python-ai-notes"
version = "0.1.0"
description = "Small, per-concept learning notes on production Python and AI-agent engineering."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One entry per section; chunk packages inside a section are included automatically.
packages = [
    "s01_python",
    "s02_data_modeling",
    "s03_ai_agents",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Chunks import as section.chunk packages (s01_python.c01_...) from the repo root.
pythonpath = ["."]
# Test files in different sections may share a basename.
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
