[project]
name = "python-ai-notes"
version = "0.1.0"
description = "Small, per-concept learning notes on production Python and AI-agent engineering."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Each chapter is its own importable package. Add new chapters here.
packages = [
    "ch01_asyncio_and_gil",
    "ch02_decorators",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Chapters import as top-level packages (ch01_..., ch02_...) from the repo root.
pythonpath = ["."]
asyncio_mode = "auto"
